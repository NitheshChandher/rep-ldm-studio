name: rep-ldm-studio
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.7
  - numpy
  - pandas
  - pillow
  - scipy
  - dlib          # prebuilt from conda-forge, avoids cmake compilation
  - tqdm
  - pip
  - pip:
      - diffusers==0.18.2
      - transformers>=4.25
      - accelerate
      - timm
      - fastapi
      - uvicorn
      - python-multipart
